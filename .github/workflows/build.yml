name: build
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || null }}

on:
  push:
  pull_request:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # python-version: '3.9'
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip rename
          sudo pip3 install meson

      - name: Download deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      - name: Sign release apk
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: noriban/sign-android-release@v5
        with:
          releaseDirectory: app/build/outputs/apk/default/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: testkey
          keyStorePassword: testkey
          keyPassword: testkey

      - name: Rename release apk
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          find . -type f -name '*-signed.apk' -exec mv -v {} . \;
          prename -v "s/^app-default/mpv-android+ytdl-$GITHUB_REF_NAME/;s/-release.+(?=\.apk)//" *.apk
          ls -lh *.apk

      - name: Upload artifact (release)
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-release
          path: app/build/outputs/apk/default/release/*.apk

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-debug
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Upload release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: false
          draft: false
          body: |
            # mpv-android with yt-dlp support
            ## What's new
          files: mpv-android*.apk
